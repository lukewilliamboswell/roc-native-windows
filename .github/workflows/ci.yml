name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accessibility:
        description: Run the external Windows UI Automation probe
        type: boolean
        default: false
      windows_arm:
        description: Run native scenarios on Windows on Arm
        type: boolean
        default: false
      standalone:
        description: Validate Reading List generated from a staged release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS source checks
            runner: macos-15
            task: check
          - name: Linux cross-build
            runner: ubuntu-24.04
            task: build
          - name: Windows x64 behavior
            runner: windows-2025
            # The native and UI Automation suites build their own executables.
            task: bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@ca31a848926b19ec2aed867c481ef691b55aaeb8
        with:
          cache: 'true'
          cache-workload: windows-platform
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Run the Blueprint source or build checks
        id: build
        run: blueprint run ${{ matrix.task }}
      - name: Run Windows host unit tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path host/Cargo.toml
      - name: Run native Windows scenarios
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.conclusion == 'success' }}
        run: blueprint run test-native -- --target x64mingw
      - name: Probe Windows UI Automation
        if: ${{ !cancelled() && runner.os == 'Windows' && inputs.accessibility && steps.build.conclusion == 'success' }}
        run: blueprint run test-accessibility -- -FreshStarter -BuildProfile size
      - name: Build the documentation
        if: runner.os == 'macOS'
        run: blueprint run docs

  stage-windows:
    name: Stage Windows validation artifacts
    if: inputs.windows_arm || inputs.standalone
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      arm_artifact: ${{ steps.upload-arm.outputs.artifact-id }}
      preview_artifact: ${{ steps.upload-preview.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Bundle the Windows platform
        id: bundle
        run: roc scripts/build.roc -- bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-arm
        if: inputs.windows_arm
        with:
          name: windows-link-inputs
          path: platform/targets/
          if-no-files-found: error
      - name: Stage the standalone release preview
        id: preview
        if: ${{ !cancelled() && inputs.standalone && steps.bundle.conclusion == 'success' }}
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          shopt -s nullglob
          bundles=(dist/platform/*.tar.zst)
          test "${#bundles[@]}" -eq 1
          roc scripts/release.roc -- --local 0.1.0 "${bundles[0]}" dist/release-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-preview
        if: ${{ !cancelled() && inputs.standalone && steps.preview.conclusion == 'success' }}
        with:
          name: windows-release-preview
          path: dist/release-preview/
          if-no-files-found: error

  windows-arm:
    name: Windows ARM64 ${{ matrix.suite }}
    needs: stage-windows
    if: ${{ !cancelled() && inputs.windows_arm && needs.stage-windows.outputs.arm_artifact != '' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.accessibility && '["scenarios", "accessibility"]' || '["scenarios"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: windows-link-inputs
          path: platform/targets/
      - name: Install the pinned Windows x64 Roc compiler for emulation
        shell: pwsh
        run: |
          function Get-VerifiedFile($Url, $Path, $Sha256) {
            Invoke-WebRequest -Uri $Url -OutFile $Path
            if ((Get-FileHash -Algorithm SHA256 $Path).Hash -ne $Sha256) {
              throw "Download digest mismatch for $Url"
            }
          }
          $tools = Join-Path $env:RUNNER_TEMP "roc-windows-tools"
          New-Item -ItemType Directory -Path $tools | Out-Null
          $archive = Join-Path $tools "roc.zip"
          Get-VerifiedFile `
            "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-11-26-890d6c8/roc_nightly-windows_x86_64-2026-11-26-890d6c8.zip" `
            $archive "7d2d3a1b48acb2f889f5c3eb1b0ec6a6e5c075cff25ea9c89bcf8b2820105648"
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $roc = Get-ChildItem $tools -Recurse -File -Filter roc.exe | Select-Object -First 1
          if (!$roc) { throw "The pinned compiler archive did not contain roc.exe" }
          $roc.DirectoryName | Add-Content -Path $env:GITHUB_PATH
          "ROC_WINDOWS_ROC=$($roc.FullName)" | Add-Content -Path $env:GITHUB_ENV
          & $roc.FullName version
      # Run the task script with the verified compiler. Blueprint's embedded
      # compiler setup stalled under x64 emulation before the tasks began.
      - name: Run native Windows scenarios
        if: matrix.suite == 'scenarios'
        run: roc scripts/build.roc -- test-native --target arm64mingw
      - name: Probe Windows UI Automation
        if: matrix.suite == 'accessibility'
        run: roc scripts/build.roc -- test-accessibility -Target arm64mingw -FreshStarter -BuildProfile size

  windows-standalone:
    name: Windows x64 standalone Reading List
    needs: stage-windows
    if: ${{ !cancelled() && inputs.standalone && needs.stage-windows.outputs.preview_artifact != '' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: windows-release-preview
          path: ${{ runner.temp }}/windows-release-preview
      - name: Verify the standalone-generated app
        shell: pwsh
        run: tests/accessibility/standalone.ps1 -ReleaseDirectory "$env:RUNNER_TEMP/windows-release-preview"
