name: Release Windows platform

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/release.roc
      - scripts/release_evidence.py
      - tests/accessibility/installer.ps1
      - tests/accessibility/standalone.ps1
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix
        type: string
        required: true
      publish:
        description: Publish the verified assets from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_VERSION: ${{ inputs.version || '0.0.1' }}
  RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.version || '0.0.1' }}

jobs:
  stage:
    name: Stage release and loopback preview
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build the platform and packagers
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          rustup target add x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          roc scripts/build.roc -- bundle
          shopt -s nullglob
          bundles=(dist/platform/*.tar.zst)
          test "${#bundles[@]}" -eq 1
          roc scripts/release.roc -- "$RELEASE_VERSION" "${bundles[0]}" "$RELEASE_BASE_URL" dist/release
          roc scripts/release.roc -- --local --packagers dist/release "$RELEASE_VERSION" "${bundles[0]}" dist/release-preview
          # The preview changes the launcher URLs. The platform and packagers must match.
          for asset in dist/release/roc-*; do
            cmp "$asset" "dist/release-preview/${asset##*/}"
          done
      - name: Collect license notices, SBOMs, and asset checksums
        run: python3 scripts/release_evidence.py dist/release "$RELEASE_VERSION" "$RELEASE_BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-preview
          path: dist/release-preview/
          if-no-files-found: error

  smoke:
    name: Verify the generated app and x64 installer
    needs: stage
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: windows-release-preview
          path: ${{ runner.temp }}/windows-release-preview
      - name: Bootstrap, test, and package Reading List
        shell: pwsh
        run: |
          tests/accessibility/standalone.ps1 `
            -ReleaseDirectory "$env:RUNNER_TEMP/windows-release-preview" `
            -TestInstaller -ArmInstallersDirectory "$env:RUNNER_TEMP/arm-installers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm-installers
          path: ${{ runner.temp }}/arm-installers/
          if-no-files-found: error

  install-arm:
    name: Verify the ARM64 installer
    needs: smoke
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: arm-installers
          path: ${{ runner.temp }}/arm-installers
      - name: Install, launch, upgrade, and uninstall Reading List
        shell: pwsh
        run: tests/accessibility/installer.ps1 -PackageDirectory "$env:RUNNER_TEMP/arm-installers" -Target arm64mingw

  publish:
    name: Publish the GitHub release
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-native-windows'
    needs: install-arm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: windows-release
          path: release/
      - name: Verify staged assets after transfer
        working-directory: release
        run: sha256sum --strict --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*
      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Build native Windows x64 and ARM64 desktop apps in Roc. The CLI bundle bootstraps a Reading List or Counter app and packages it as an MSI or ZIP.

          Use the pinned Roc nightly and follow the starter guide. [Roc nightly](https://github.com/roc-lang/nightlies/releases/tag/nightly-2026-11-26-890d6c8) · [Windows app guide](https://lukewilliamboswell.github.io/roc-native-windows/apps.html)

          `SHA256SUMS` lists the assets and SBOMs. GitHub build provenance covers every uploaded file. The `.spdx.json` files inventory the release subjects and their resolved components, with coverage gaps recorded for native runtime symbols and transitive supplier inputs. Original notices are in the dependency license archive.
          EOF
          gh release create "$RELEASE_VERSION" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --draft
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/verified"
          diff --recursive release "$RUNNER_TEMP/verified"
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

  verify:
    name: Verify the published bootstrap
    needs: publish
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: nightly-2026-11-26-890d6c8
          cache: 'false'
      - name: Bootstrap from the public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:RELEASE_VERSION --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not look up the published release.' }
          $tools = @($assets.assets | Where-Object name -Like 'windows-*.tar.zst')
          if ($tools.Count -ne 1) { throw 'Expected one published CLI bundle.' }
          tests/accessibility/standalone.ps1 -ReleaseUrl $tools[0].url -TestInstaller
